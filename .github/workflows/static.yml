# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Single deploy job since we're just deploying
  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate site before deployment
        run: |
          python3 -B -m unittest discover -s tests
          python3 -B scripts/seo_quality_check.py
          python3 -B scripts/structured_data_check.py
          python3 -B scripts/content_policy_check.py
          python3 -B scripts/performance_budget_check.py
          node --check site-v20260930.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage public website files
        run: python3 -B scripts/build_public_site.py --output "$RUNNER_TEMP/shumaojs-public" --revision "$(git rev-parse HEAD)"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/shumaojs-public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
