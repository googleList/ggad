name: Weekly Article Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect article research data
        run: python scripts/collect_articles.py --max-pages 5 --max-per-source 40 --detail-limit 30

      - name: Commit updated article data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/article-sources.json data/collected-articles.json reports/collected-articles.html scripts/collect_articles.py
          if git diff --cached --quiet; then
            echo "No article changes to commit."
          else
            git commit -m "chore: update weekly article research"
            git push
          fi
