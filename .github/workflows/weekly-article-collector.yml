name: Weekly Article Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"
  push:
    branches: [main]
    paths:
      - .github/workflows/weekly-article-collector.yml
      - tools/collect-ad-learning.js
      - scripts/collect_articles.py
      - data/article-sources.json

permissions:
  contents: read

concurrency:
  group: weekly-article-collector
  cancel-in-progress: false

jobs:
  refresh-public-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh curated advertising resources
        run: node tools/collect-ad-learning.js

      - name: Commit changed resource data and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ad-learning.json ad-learning.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No resource changes to commit."
          else
            git commit -m "chore: refresh weekly advertising resources"
            git push
          fi

  collect-research-briefs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect metadata and research briefs
        run: >-
          python -B scripts/collect_articles.py
          --sources data/article-sources.json
          --max-pages 5
          --max-per-source 40
          --detail-limit 30
          --output "$RUNNER_TEMP/collected-articles.json"
          --report "$RUNNER_TEMP/collected-articles.html"

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-article-research-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/collected-articles.json
            ${{ runner.temp }}/collected-articles.html
          if-no-files-found: warn
          retention-days: 90

  deploy-refreshed-site:
    name: Deploy refreshed site to GitHub Pages
    needs: refresh-public-learning
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate site before deployment
        run: |
          python3 -B -m unittest discover -s tests
          python3 -B scripts/seo_quality_check.py
          python3 -B scripts/structured_data_check.py
          python3 -B scripts/content_policy_check.py
          python3 -B scripts/performance_budget_check.py
          node --check site-v20260930.js

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Stage public website files
        run: python3 -B scripts/build_public_site.py --output "$RUNNER_TEMP/shumaojs-public" --revision "$(git rev-parse HEAD)"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/shumaojs-public

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v5
